<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Test</title>
</head>

<body>

<header align="center">
    <h1> Hands on Test on HTML </h1>
</header>

<nav align="center">
    <a href="#image-link">Image Link</a> &nbsp;
    <a href="#video-section">Video Section</a> &nbsp;
    <a href="#contact-form">Contact Form</a>
</nav> <hr

<main>
    <section id="image-link">
        <h2>Image Link</h2>
        <a href="mailto:someone@example.com">
            <img src="https://images.unsplash.com/photo-1593108408993-58ee9c7825c2?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1470&q=80" alt="Email link image" width="900" height="600">
        </a>
    </section> <hr>

    <section id="video-section">
        <h2>Video Section</h2>
        <video width="800" controls poster="https://assets.codepen.io/32795/poster.png">
            <source src="http://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
            <source src="http://media.w3.org/2010/05/sintel/trailer.webm" type="video/webm">
            <source src="http://media.w3.org/2010/05/sintel/trailer.ogv" type="video/ogg">
            <track src="subtitles_en.vtt" kind="subtitles" srclang="en" label="English">
            <track src="subtitles_de.vtt" kind="subtitles" srclang="de" label="German Deutsch">
            Your browser does not support the video tag.
        </video>
    </section> <hr>

    <section id="contact-form">
        <h2>Contact Form</h2>
        <form action="#" method="post">
            <fieldset>
                <legend>Contact Form</legend>

                <p>
                    <label for="name">Your name</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="phone">Your Phone</label><br>
                    <input type="tel" id="phone" name="phone" pattern="^(?:\+?880|0)1[3-9]\d{8}$" placeholder="01XXXXXXXXX" required>
                </p>

                <p>
                    <label for="email">Your Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="country">Your country</label><br>
                    <select id="country" name="country">
                        <option value="bangladesh">Bangladesh</option>
                        <option value="india">India</option>
                        <option value="pakistan">Pakistan</option>
                        <option value="nepal">Nepal</option>
                        <option value="sri-lanka">Sri Lanka</option>
                        <option value="usa">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="canada">Canada</option>
                        <option value="australia">Australia</option>
                        <option value="germany">Germany</option>
                        <option value="japan">Japan</option>
                    </select>
                </p>

                <p>
                    <label for="state">Your State</label><br>
                    <select id="state" name="state">
                        <option value="dhaka">Dhaka</option>
                        <option value="chittagong">Chittagong</option>
                        <option value="khulna">Khulna</option>
                        <option value="rajshahi">Rajshahi</option>
                        <option value="sylhet">Sylhet</option>
                        <option value="barishal">Barishal</option>
                        <option value="rangpur">Rangpur</option>
                        <option value="mymensingh">Mymensingh</option>
                        <option value="comilla">Comilla</option>
                        <option value="narayanganj">Narayanganj</option>
                    </select>
                </p>

                <p>
                    <label for="message">Your message</label><br>
                    <textarea id="message" name="message" rows="5" cols="30"></textarea>
                </p>

                <p>
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </p>
            </fieldset>
        </form>
    </section> <hr>
</main>

<footer align="center">
    <p>&copy; 2026 Md. Abu Touhid. All rights reserved.</p>
</footer>

</body>
</html>
